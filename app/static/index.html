<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio/Video Data Converter</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%236aa6ff'/%3E%3Cellipse cx='16' cy='16' rx='14' ry='4.5' fill='none' stroke='%23f2b84b' stroke-width='2' transform='rotate(-20 16 16)'/%3E%3C/svg%3E">
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><circle cx="16" cy="16" r="7" fill="var(--accent)"/><ellipse cx="16" cy="16" rx="14" ry="4.5" fill="none" stroke="var(--accent2)" stroke-width="2" transform="rotate(-20 16 16)"/></svg>
    <div>
      <h1>Audio/Video Data Converter</h1>
      <p class="sub" data-i18n="subtitle"></p>
    </div>
  </div>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="de">DE</button>
    <button type="button" data-lang="en">EN</button>
  </div>
</header>

<nav class="tabs" role="tablist">
  <button role="tab" class="tab active" data-tab="encode" data-i18n="tab_encode"></button>
  <button role="tab" class="tab" data-tab="decode" data-i18n="tab_decode"></button>
</nav>

<main>
<!-- ================================================================ ENCODE -->
<section id="tab-encode" class="panel">
  <div class="grid">
    <div class="card">
      <h2><span class="step">1</span><span data-i18n="src_title"></span></h2>
      <label class="drop" id="srcDrop">
        <input type="file" id="srcInput" accept="video/*,audio/*,.mkv,.flac,.wav">
        <span data-i18n="src_pick"></span>
      </label>
      <div id="srcProgress" class="progress hidden"><div></div><span></span></div>
      <div id="srcInfo" class="info hidden"></div>
    </div>

    <div class="card">
      <h2><span class="step">2</span><span data-i18n="files_title"></span></h2>
      <label class="drop" id="filesDrop">
        <input type="file" id="filesInput" multiple>
        <span data-i18n="files_pick"></span>
      </label>
      <ul id="fileList" class="filelist"></ul>
      <div id="filesTotal" class="muted"></div>
    </div>

    <div class="card">
      <h2><span class="step">3</span><span data-i18n="opt_title"></span></h2>
      <div class="form">
        <label><span data-i18n="opt_password"></span>
          <input type="password" id="encPassword" autocomplete="new-password" data-i18n-ph="opt_password_ph"></label>
        <label id="kRow"><span data-i18n="opt_fps"></span>
          <input type="number" id="optK" min="1" value="1"></label>
        <label><span data-i18n="opt_bits"></span>
          <select id="optBits"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></label>
        <label class="check"><input type="checkbox" id="optRs"> <span data-i18n="opt_rs"></span></label>
        <label id="vcodecRow"><span data-i18n="opt_vcodec"></span>
          <select id="optVcodec"><option value="ffv1">FFV1 (MKV)</option><option value="h264">H.264 lossless (MKV)</option></select></label>
        <label id="aformatRow" class="hidden"><span data-i18n="opt_aformat"></span>
          <select id="optAformat"><option value="flac">FLAC</option><option value="wav">WAV</option></select></label>
      </div>
    </div>

    <div class="card">
      <h2><span class="step">4</span><span data-i18n="cap_title"></span></h2>
      <div id="capBox" class="muted" data-i18n="cap_empty"></div>
    </div>
  </div>

  <div class="actions">
    <button id="encodeBtn" class="primary" disabled data-i18n="btn_encode"></button>
    <div id="encProgress" class="progress hidden"><div></div><span></span></div>
  </div>
  <div id="encMsg"></div>
  <div id="encResult" class="card hidden"></div>
</section>

<!-- ================================================================ DECODE -->
<section id="tab-decode" class="panel hidden">
  <div class="grid two">
    <div class="card">
      <h2><span class="step">1</span><span data-i18n="dec_src_title"></span></h2>
      <label class="drop" id="decDrop">
        <input type="file" id="decInput" accept="video/*,audio/*,.mkv,.flac,.wav">
        <span data-i18n="dec_pick"></span>
      </label>
      <div id="decName" class="muted"></div>
    </div>
    <div class="card">
      <h2><span class="step">2</span><span data-i18n="dec_pw_title"></span></h2>
      <div class="form">
        <label><span data-i18n="opt_password"></span>
          <input type="password" id="decPassword" autocomplete="current-password" data-i18n-ph="dec_pw_ph"></label>
      </div>
    </div>
  </div>
  <div class="actions">
    <button id="decodeBtn" class="primary" disabled data-i18n="btn_decode"></button>
    <div id="decProgress" class="progress hidden"><div></div><span></span></div>
  </div>
  <div id="decMsg"></div>
  <div id="decResult" class="hidden">
    <div class="card"><h2 data-i18n="dec_files"></h2><div id="decFiles"></div></div>
    <div class="card"><h2 data-i18n="dec_timeline"></h2><div id="decTimeline"></div></div>
    <div class="card"><h2 data-i18n="dec_manifest"></h2><div id="decParams"></div>
      <details><summary data-i18n="dec_raw"></summary><pre id="decRaw"></pre></details></div>
  </div>
</section>
</main>

<footer class="muted" data-i18n="footer"></footer>
<script src="app.js"></script>
</body>
</html>
